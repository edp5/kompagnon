services:
  db:
    image: postgres:18.1-alpine
    container_name: kompagnon-postgres-prod
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kompagnon-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: prod/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
    container_name: kompagnon-api-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:${PORT}"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${PORT}/api/health || exit 1" ]
      timeout: 5s
      interval: 10s
      retries: 5
    networks:
      kompagnon-network:

networks:
  kompagnon-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
