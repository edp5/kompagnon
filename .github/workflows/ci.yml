name: ci

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  push:
    branches:
      - main
  merge_group:

jobs:
  root-lint:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code, setup node and install dependencies
        uses: edp5/edp5-actions/checkout-node@v1.9.0
        with:
          file-version: .nvmrc
          installCommand: npm ci

      - name: Run lint
        run: npm run lint:root

  api-lint:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code, setup node and install dependencies
        uses: edp5/edp5-actions/checkout-node@v1.9.0
        with:
          file-version: .nvmrc
          installCommand: npm ci
          workingDirectory: ./api

      - name: Run lint
        run: npm run lint
        working-directory: ./api

  api-test:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code, setup node and install dependencies
        uses: edp5/edp5-actions/checkout-node@v1.9.0
        with:
          file-version: .nvmrc
          installCommand: |
            npm ci
            cp sample.env .env
          workingDirectory: ./api

      - name: Setup docker compose
        uses: edp5/edp5-actions/setup-docker-compose@v1.9.0
        with:
          waitTime: '2'
          path: ./api

      - name: run tests with coverage
        run: npm run test:coverage
        working-directory: ./api

      - name: Upload coverage reports to Codecov
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-coverage') }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./api/coverage
          flags: api
          name: api-test

  web-lint:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code, setup node and install dependencies
        uses: edp5/edp5-actions/checkout-node@v1.9.0
        with:
          file-version: .nvmrc
          installCommand: npm ci
          workingDirectory: ./web

      - name: Run lint
        run: npm run lint
        working-directory: ./web

  web-test:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code, setup node and install dependencies
        uses: edp5/edp5-actions/checkout-node@v1.9.0
        with:
          file-version: .nvmrc
          installCommand: npm ci
          workingDirectory: ./web

      - name: run tests with coverage
        run: npm run test:coverage
        working-directory: ./web

      - name: Upload coverage reports to Codecov
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-coverage') }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./web/coverage
          flags: web
          name: web-test

  admin-lint:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code, setup node and install dependencies
        uses: edp5/edp5-actions/checkout-node@v1.9.0
        with:
          file-version: .nvmrc
          installCommand: npm ci
          workingDirectory: ./admin

      - name: Run lint
        run: npm run lint
        working-directory: ./admin

  admin-test:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code, setup node and install dependencies
        uses: edp5/edp5-actions/checkout-node@v1.9.0
        with:
          file-version: .nvmrc
          installCommand: npm ci
          workingDirectory: ./admin

      - name: run tests with coverage
        run: npm run test:coverage
        working-directory: ./admin

      - name: Upload coverage reports to Codecov
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-coverage') }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./admin/coverage
          flags: admin
          name: admin-test
